name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and worked-example regression
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m pip install .
          scope-refund rates
          scope-refund claim --scope examples/2026-11-15-wrong-scope-config-gap-analysis/scope.toml \
            --usage examples/2026-11-15-wrong-scope-config-gap-analysis/usage.jsonl --format json --strict > /dev/null

text = "PR-01: Return the improved multi-product compilation; the agents had already explicitly distinguished 19 input ZIPs from the requested improved outputs. Observed: Separate pointed to the product handoff subset subset, then corrected itself. Rollout shortly afterward pointed to the same full/small subset subset, then a broader but still product handoff-only baseline. Both admitted these were not the requested 19-workstream package. Limits: Agents did not claim the 6.5 MB baseline was complete; they explicitly disclosed limitations. Size alone is not evidence of a fake ZIP. The violation is the wrong deliverable scope and repeated loss of already-established scope, not an assertion that compression was impossible."
